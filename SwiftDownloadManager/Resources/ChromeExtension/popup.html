<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swift Download Manager</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="hero-top">
          <div class="app-mark">
            <img src="icons/icon48.png" alt="" width="40" height="40" />
          </div>
          <div class="hero-copy">
            <p class="eyebrow">Companion</p>
            <h1>Swift Download Manager</h1>
          </div>
        </div>

        <div id="connection-status" class="status-pill status-checking">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-label">Checking connection…</span>
        </div>
      </header>

      <main>
        <section class="card">
          <div class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 3v10m0 0l4-4m-4 4L8 9M5 17h14"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>

          <div class="card-body">
            <div class="card-heading">
              <span class="card-title">Auto-Capture</span>
              <label class="switch">
                <input type="checkbox" id="auto-capture" />
                <span class="switch-track">
                  <span class="switch-thumb"></span>
                </span>
              </label>
            </div>
            <p class="card-description">
              Send downloads to the app instead of Chrome’s download folder.
            </p>
          </div>
        </section>

        <section class="hint hint-compact">
          <p>
            <strong>✓</strong> green badge = app connected ·
            <strong>–</strong> gray = app not reachable
          </p>
        </section>

        <section class="hint">
          <div class="hint-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M9 9h6v6H9V9zM12 3v2M12 19v2M3 12h2M19 12h2"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <p>
            Right-click any link to download — works even when Auto-Capture is off.
          </p>
        </section>
      </main>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
