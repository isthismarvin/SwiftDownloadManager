name: Bug Report
description: Create a report to help us improve Swift Download Manager
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.
  - type: input
    id: version
    attributes:
      label: Swift Download Manager Version
      description: What version of the app are you running? (e.g., v2.3.0)
      placeholder: "v2.3.0"
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS Version & Hardware
      description: e.g., macOS 26.0 (Tahoe), Apple Silicon M3 / Intel Core i7
      placeholder: "macOS 26.0 Tahoe, Apple Silicon M2"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open 'Swift Download Manager'
        2. Add download URL '...'
        3. Click 'Download Now'
        4. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Console Output
      description: Relevant logs from Console.app (filter: `nrw.marvin.SwiftDownloadManager`) or crash reports.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have verified this bug on the latest release of Swift Download Manager.
          required: true
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
