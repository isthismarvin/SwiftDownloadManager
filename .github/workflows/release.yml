name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package Release
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Swift version
        run: swift --version

      - name: Run unit tests
        run: ./scripts/run-tests.sh

      - name: Build Release Bundle & Compute SHA-256
        run: ./scripts/build-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' SwiftDownloadManager/Info.plist)}"
          echo "Publishing release for $TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/*.dmg \
            dist/*.zip \
            dist/SHA256SUMS.txt || \
          gh release upload "$TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt --clobber
