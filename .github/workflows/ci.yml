name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Full app build requires macOS 26 SDK (Xcode 26+). Unit tests run on any recent macOS runner.

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run unit tests
        run: ./scripts/run-tests.sh

  build:
    name: Build (macOS 26+)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild \
            -scheme SwiftDownloadManager \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint
